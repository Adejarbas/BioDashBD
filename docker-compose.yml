services:
  biodash-backend:
    image: thiagohmn93/biodashbd:latest
    build:
      context: .
    container_name: biodash_backend
    ports:
      - "3003:3003"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
